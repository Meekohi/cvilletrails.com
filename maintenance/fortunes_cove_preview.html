<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune’s Cove trail preview</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.11.1/mapbox-gl.css" rel="stylesheet"><script src="https://api.mapbox.com/mapbox-gl-js/v3.11.1/mapbox-gl.js"></script>
<style>body{margin:0;font:15px system-ui;color:#183d31}#map{position:absolute;inset:0}aside{position:absolute;top:12px;left:12px;max-width:300px;background:#fffef7;padding:18px;border-radius:14px;box-shadow:0 2px 12px #0003}h1{font-size:20px;margin:0 0 10px}p{line-height:1.5}a{color:#245c46}button{padding:8px;border:1px solid #aaa;background:white;border-radius:6px}#status{font-size:13px} @media(max-width:600px){aside{max-width:230px;font-size:13px;padding:12px}}</style>
<div id="map"></div><aside><h1>Fortune’s Cove Preserve</h1><p>Official June 2020 map vectors in their embedded geographic coordinates.</p><p>Yellow: outer route and overlook spur.<br>White: lower-loop shortcut.</p><p>Parking-area gaps follow the source map. Roads and preserve boundaries were not imported.</p><p><a href="official-map.pdf" target="_blank" rel="noopener">Official PDF</a> · <a href="trails.geojson" download>Download GeoJSON</a></p><button id="toggle">Hide proposed trails</button><p id="status">Loading…</p></aside>
<script>
(async()=>{const config=await(await fetch('preview.json')).json();const style=await(await fetch('style-proposal.json')).json();mapboxgl.accessToken=config.public_token;const map=window.__previewMap=new mapboxgl.Map({container:'map',style,center:config.center,zoom:14});map.addControl(new mapboxgl.NavigationControl());map.on('load',()=>{map.addSource('proposal',{type:'geojson',data:'trails.geojson'});map.addLayer({id:'proposal-fringe',type:'line',source:'proposal',paint:{'line-color':'#65472e','line-width':6},layout:{'line-cap':'round','line-join':'round'}});map.addLayer({id:'proposal-lines',type:'line',source:'proposal',paint:{'line-color':['match',['get','color'],'yellow','#ffe14f','white','#fff','#ded0c5'],'line-width':3.5},layout:{'line-cap':'round','line-join':'round'}});map.addSource('entrance',{type:'geojson',data:{type:'Feature',properties:{},geometry:{type:'Point',coordinates:config.operator_map_pin}}});map.addLayer({id:'entrance',type:'circle',source:'entrance',paint:{'circle-color':'#286946','circle-radius':6,'circle-stroke-color':'#fff','circle-stroke-width':2}});map.fitBounds(config.bounds,{padding:{top:80,bottom:65,left:innerWidth>700?360:50,right:70},duration:0});document.querySelector('#status').textContent='Seven trail segments. Green point: TNC’s entrance pin.';});let visible=true;document.querySelector('#toggle').onclick=()=>{visible=!visible;for(const id of ['proposal-fringe','proposal-lines'])map.setLayoutProperty(id,'visibility',visible?'visible':'none');document.querySelector('#toggle').textContent=visible?'Hide proposed trails':'Show proposed trails';};})();
</script></html>
