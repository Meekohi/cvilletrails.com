<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virginia State Parks review</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.11.1/mapbox-gl.css" rel="stylesheet"><script src="https://api.mapbox.com/mapbox-gl-js/v3.11.1/mapbox-gl.js"></script>
<style>body{margin:0;font:14px system-ui;color:#17392e}#map{position:absolute;inset:0}aside{position:absolute;left:12px;top:12px;bottom:35px;width:320px;overflow:auto;background:#fffef8;padding:16px;border-radius:12px;box-shadow:0 2px 14px #0003}h1{font-size:20px;margin:0 0 12px}p{line-height:1.45}select,textarea{width:100%;box-sizing:border-box}select,button{padding:9px;margin:4px 0}a{color:#245a45}li{margin:8px 0}.held{color:#a52d29}#trails{padding-left:18px}small{color:#596a61}button{cursor:pointer} @media(max-width:650px){aside{width:240px;max-height:50vh;bottom:auto}}</style>
<div id="map"></div><aside><h1>Virginia State Parks</h1><select id="parks" aria-label="Park"></select><p id="summary"></p><p id="sources"></p><p><small>Preview colors approximate GIS blaze names. Check the official map, current alerts, and overlap with existing trails. Red dashed lines are held out.</small></p><label><input id="held" type="checkbox" checked> Show held records</label><p id="state"></p><button id="include">Queue eligible trails for import</button> <button id="hold">Hold for discussion</button><textarea id="notes" rows="3" aria-label="Review notes" placeholder="Notes or exceptions"></textarea><button id="export">Export review decisions</button><p><a href="trails.geojson" download>Download review GeoJSON</a></p><ul id="trails"></ul></aside>
<script>
(async()=>{const [report,config]=await Promise.all(['review.json','preview.json'].map(u=>fetch(u).then(r=>r.json())));window.__reviewReport=report;const key='state-parks-'+report.review_hash;let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};let current;const $=id=>document.getElementById(id);for(const park of report.parks){const o=document.createElement('option');o.value=park.name;o.textContent=park.name;$('parks').append(o)}$('parks').value='Lake Anna State Park';mapboxgl.accessToken=config.public_token;const map=window.__reviewMap=new mapboxgl.Map({container:'map',style:config.style,center:[-77.82,38.12],zoom:13});map.addControl(new mapboxgl.NavigationControl());
function save(){localStorage.setItem(key,JSON.stringify(saved))}function status(){$('state').textContent=current.status==='pilot'?'Lake Anna: pilot import.':saved[current.name]?.decision||'Not reviewed';$('include').disabled=current.status==='pilot'||current.eligible===0;$('hold').disabled=current.status==='pilot'}
function show(){current=report.parks.find(p=>p.name===$('parks').value);$('summary').textContent=`${current.total} records: ${current.eligible} eligible for review, ${current.held} held. Eligibility does not establish access or approval.`;$('sources').replaceChildren();for(const [field,label] of [['visitor_guide','Official park page'],['georeferenced_pdf','Official map'],['maps_directory','DCR map directory']]){if(current.sources[field]){const a=document.createElement('a');a.href=current.sources[field];a.textContent=label;a.target='_blank';a.rel='noopener';$('sources').append(a,document.createElement('br'))}}$('trails').replaceChildren();for(const t of current.trails){const li=document.createElement('li');li.className=t.hold_reasons.length?'held':'';li.textContent=`${t.name||'Unnamed'} — ${t.blaze||'no blaze listed'}; ${t.uses||'use unknown'}; ${t.status||'status unknown'}${t.hold_reasons.length?' — HOLD: '+t.hold_reasons.join(', '):''}`;$('trails').append(li)}$('notes').value=saved[current.name]?.notes||'';status();for(const id of ['review-fringe','review-trails','review-held'])map.setFilter(id,['all',['==',['get','review_park'],current.name],['==',['get','review_held'],id==='review-held']]);if(current.bounds)map.fitBounds(current.bounds,{padding:{left:innerWidth>700?390:40,right:65,top:80,bottom:60},maxZoom:15,duration:0})}
map.on('load',()=>{map.addSource('review',{type:'geojson',data:'trails.geojson'});map.addLayer({id:'review-fringe',type:'line',source:'review',paint:{'line-color':'#65472e','line-width':6}});map.addLayer({id:'review-trails',type:'line',source:'review',paint:{'line-color':['match',['downcase',['coalesce',['get','BlazeColor'],'']],'yellow','#ffe800','blue','#004da8','red','#ff0000','green','#4d8c00','white','#ffffff','silver','#828282','purple','#8400a8','orange','#ffaa00','tan','#cdaa66','none','#000000','black','#222','pink','#ef9bce','#ded0c5'],'line-width':3.5}});map.addLayer({id:'review-held',type:'line',source:'review',paint:{'line-color':'#d13030','line-width':4,'line-dasharray':[2,2]}});show()});$('parks').onchange=show;$('held').onchange=()=>map.setLayoutProperty('review-held','visibility',$('held').checked?'visible':'none');for(const [id,decision]of [['include','queue-import'],['hold','hold']])$(id).onclick=()=>{saved[current.name]={decision,notes:$('notes').value};save();status()};$('notes').oninput=()=>{saved[current.name]={...saved[current.name],notes:$('notes').value};save()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({kind:'virginia-state-parks-review',review_hash:report.review_hash,source_hash:report.source_hash,decisions:saved},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='virginia-state-parks-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};})();
</script></html>
